<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <style>
        #address{width: 400px;}
    </style>
    <script src="//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script>
        function postBtn(){
            alert("다음주소로 우편번호 검색을 시작합니다.");

            new kakao.Postcode({
                oncomplete: function(data) {
                    console.log("우편번호 : ",data.zonecode)
                    console.log("주소 : ",data.address)
                    document.getElementById("zipcode").value=data.zonecode;
                    document.getElementById("address").value=data.address;
                }
            }).open();




        }

    </script>
</head>
<body>
    <form name="frm" action="p0910_05.html" method="get">
        <label>아이디</label>
        <input type="text" name="id" id="id" ><br>
        <label>패스워드</label>
        <input type="password" name="pw" id="pw"><br>
        <label>이름</label>
        <input type="text" name="name" id="name"><br>
        <label>주소</label><br>
        <label>우편번호</label>
        <input type="text" name="zipcode" id="zipcode">
        <button type="button" onclick="postBtn()">우편번호 검색</button><br>
        <label>상세주소</label>
        <input type="text" name="address" id="address"><br>
        <label>성별</label><br>
        <input type="radio" name="gender" id="man" value="남자">
        <label for="man">남자</label>
        <input type="radio" name="gender" id="woman" value="여자">
        <label for="woman">여자</label>
        <br>
        <label>취미</label><br>
        <input type="checkbox" name="hobby" id="game" value="게임">
        <label for="game">게임</label>
        <input type="checkbox" name="hobby" id="golf" value="골프">
        <label for="golf">골프</label>
        <input type="checkbox" name="hobby" id="swim" value="수영">
        <label for="swim">수영</label>
        <input type="checkbox" name="hobby" id="run" value="조깅">
        <label for="run">조깅</label>
        <input type="checkbox" name="hobby" id="book" value="독서">
        <label for="book">독서</label>
        <br>


        <input type="submit" value="전송">

    </form>

</body>
</html>
