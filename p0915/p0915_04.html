<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css" 
    integrity="sha512-10/jx2EXwxxWqCLX/hHth/vu2KY3jCF70dCQB8TSgNjbCVAC/8vai53GfMDrO2Emgwccf2pJqxct9ehpzG+MTw==
    " crossorigin="anonymous" referrerpolicy="no-referre">
    
    <style>
        *{margin: 0; padding: 0;}
        section{width:800px; height: 3000px; border: 1px solid black;
        margin: 50px auto;position:relative;}
        div{width: 100px; height:100px; border: 3px solid black; box-sizing: border-box;}
        #i1{position: fixed; left:1200px; top: 600px; border-radius: 50%; text-align: center; font-size: 30px; font-weight: 700; line-height: 90px;
            box-shadow: 0 0 10px 0 rgba(0,0,0,0.4); background: yellowgreen;}
        #i1:hover{background: green; color: gainsboro;}
        #i2{position: relative; left:300px; top: 250px;}
        #i3{position: relative; left: 200px; top:100px;}
        #i4{position: relative; left:100%; bottom:0%;}
        #i5{position: relative; top:100%}
        #i6{position: relative; left:300px; top:-250px;}
        a{color: inherit;text-decoration: none;}
    </style>
</head>
<body>
    <section id="s1">
        <a href="#s1"><div id="i1"><i class="fa-solid fa-arrow-up"></i> top</div></a>
        <div id="i2">2</div>
        <div id="i3">3</div>
        <div id="i4">4</div>
        <div id="i5">5</div>
        <div id="i6">6</div>
    </section>
</body>
</html>
