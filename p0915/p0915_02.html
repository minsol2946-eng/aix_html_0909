<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section{width: 700px; height: 100px; border:1px solid black;
        margin: 0 auto;}
        div{width:100px; height:60px; }
        .d1{background: blue;float: left;}
        .d2{background: yellow;float: left;}
        .d3{background: green;float: left;}
        .d4{background: gray;float: left;}
        .d5{background: orange;float: left;}
        p{width: 100px; height: 70px; background: pink;}
    </style>

</head>
<body>
    <!--CSS: 모양, 크기, 색상,위치/html: 내용,뼈대-->
    
    <section>
        <div class="d1">box1</div>
        <div class="d2">box2</div>
        <div class="d3">box3</div>
        <div class="d4">box4</div>
        <div class="d5">box5</div>
    </section>
    <p>Hello</p>
</body>
</html>
