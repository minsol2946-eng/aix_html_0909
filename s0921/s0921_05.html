<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>

    <title>학생성적프로그램</title>

    <style>
        *{margin:0; padding:0;}

        div{
            width:1200px;
            margin:0 auto;
            text-align:center;
        }

        h2{
            margin:20px 0 10px 0;
        }

        table,th,td{
            border:1px solid black;
            border-collapse:collapse;
        }

        table{
            width:1200px;
        }

        th,td{
            height:40px;
        }

        th{
            background:#efefef;
        }

        button{
            width:80px;
            height:35px;
        }
    </style>

    <script>
        // 삭제, 추가 제이쿼리로 만들기

        $(function(){

            // 수정할 학생의 id를 저장하는 변수
            var updateId = "";


            // =========================
            // 삭제
            // =========================

            $(document).on("click",".deleteBtn",function(){

                // 내가 클릭한 삭제버튼
                // parent() -> td
                // parent() -> tr
                $(this).parent().parent().remove();

            });


            // =========================
            // 저장
            // =========================

            $(".saveBtn").click(function(){

                var no = Number($("#no").val());
                var name = $("#name").val();
                var kor = Number($("#kor").val());
                var eng = Number($("#eng").val());
                var math = Number($("#math").val());

                var total = kor + eng + math;
                var avg = total / 3;
                var rank = 0;


                // 새로운 학생 추가
                $("table").append(

                    "<tr id='" + no + "'>" +

                        "<td>" + no + "</td>" +
                        "<td>" + name + "</td>" +
                        "<td>" + kor + "</td>" +
                        "<td>" + eng + "</td>" +
                        "<td>" + math + "</td>" +
                        "<td>" + total + "</td>" +
                        "<td>" + avg.toFixed(1) + "</td>" +
                        "<td>" + rank + "</td>" +

                        "<td>" +

                            "<button type='button' class='updateBtn'>수정</button>" +

                            "<button type='button' class='deleteBtn'>삭제</button>" +

                        "</td>" +

                    "</tr>"

                );


                // 입력창 초기화
                $("#no").val("");
                $("#name").val("");
                $("#kor").val("");
                $("#eng").val("");
                $("#math").val("");

            });


            // =========================
            // 수정 버튼
            // =========================

            $(document).on("click",".updateBtn",function(){

                // 클릭한 수정버튼의 tr 찾기
                var tr = $(this).parent().parent();


                // tr의 id 가져오기
                updateId = tr.attr("id");

                console.log("수정할 학생 id : " + updateId);


                // 기존 데이터 가져오기

                $("#no").val(
                    tr.children().eq(0).text()
                );

                $("#name").val(
                    tr.children().eq(1).text()
                );

                $("#kor").val(
                    tr.children().eq(2).text()
                );

                $("#eng").val(
                    tr.children().eq(3).text()
                );

                $("#math").val(
                    tr.children().eq(4).text()
                );

            });


            // =========================
            // 수정 완료
            // =========================

            $("#updateCompleteBtn").click(function(){

                var no = Number($("#no").val());
                var name = $("#name").val();
                var kor = Number($("#kor").val());
                var eng = Number($("#eng").val());
                var math = Number($("#math").val());

                var total = kor + eng + math;
                var avg = total / 3;
                var rank = 0;


                // 기존 tr의 내용을 수정
                $("#" + updateId).html(

                    "<td>" + no + "</td>" +
                    "<td>" + name + "</td>" +
                    "<td>" + kor + "</td>" +
                    "<td>" + eng + "</td>" +
                    "<td>" + math + "</td>" +
                    "<td>" + total + "</td>" +
                    "<td>" + avg.toFixed(1) + "</td>" +
                    "<td>" + rank + "</td>" +

                    "<td>" +

                        "<button type='button' class='updateBtn'>수정</button>" +

                        "<button type='button' class='deleteBtn'>삭제</button>" +

                    "</td>"

                );


                alert("수정되었습니다.");


                // 입력창 초기화
                $("#no").val("");
                $("#name").val("");
                $("#kor").val("");
                $("#eng").val("");
                $("#math").val("");

            });

        });

    </script>
</head>

<body>

    <div>

        <h2>학생성적입력</h2>

        <input type="text" name="no" id="no" placeholder="번호입력"><br>

        <input type="text" name="name" id="name" placeholder="이름입력"><br>

        <input type="text" name="kor" id="kor" placeholder="국어입력"><br>

        <input type="text" name="eng" id="eng" placeholder="영어입력"><br>

        <input type="text" name="math" id="math" placeholder="수학입력"><br>

        <br>

        <button type="button" class="saveBtn">저장</button>

        <button type="button" id="updateCompleteBtn">수정 완료</button>

        <button type="button" class="conBtn">가져오기</button>


        <h2>학생성적리스트</h2>

        <table>

            <colgroup>
                <col width="10%">
                <col width="15%">
                <col width="10%">
                <col width="10%">
                <col width="10%">
                <col width="10%">
                <col width="10%">
                <col width="10%">
                <col width="15%">
            </colgroup>


            <tr>
                <th>번호</th>
                <th>이름</th>
                <th>국어</th>
                <th>영어</th>
                <th>수학</th>
                <th>합계</th>
                <th>평균</th>
                <th>등수</th>
                <th>비고</th>
            </tr>


            <tr id="1">
                <td>1</td>
                <td>홍길동</td>
                <td>100</td>
                <td>100</td>
                <td>100</td>
                <td>300</td>
                <td>100.0</td>
                <td>0</td>

                <td>
                    <button type="button" class="updateBtn">수정</button>
                    <button type="button" class="deleteBtn">삭제</button>
                </td>

            </tr>

        </table>

    </div>

</body>
</html>
