<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h2{text-align: center;}
    table,tr,td{border:1px solid black; border-collapse: collapse;}
    table{width:1000px; text-align:center; box-sizing: border-box;
    margin: 50px auto;}
    th{background: #bd90b2; height:60px;}
    td{height:40px;}
</style>
<body>
    <h2>학생석적프로그램</h2>
    <table>
        <colgroup>
        <col width="10%">
        <col width="20%">
        <col width="10%">
        <col width="10%">
        <col width="10%">
        <col width="15%">
        <col width="15%">
        <col width="10%">
        </colgroup>
        <thead>
        <tr>
            <td>번호</td>
            <td>이름</td>
            <td>국어</td>
            <td>영어</td>
            <td>수학</td>
            <td>합계</td>
            <td>평균</td>
            <td>등수</td>
        </tr>
        </thead>
        <tbody id="tbody">

        </tbody>
    </table>

    </div>
    <script>
        
        //그냥 외워

        var a=``; //변수 선언
        for (var i=1;i<=10;i++)
            {a+= `<tr><td>${i}</td><td>홍길동</td><td>100</td><td>100</td><td>100</td><td>300</td><td>100</td><td>0</td></tr>`}
            document.getElementById("tbody").innerHTML=a;

    </script>
    
</body>
</html>
