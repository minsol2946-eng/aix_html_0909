<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{height: 5000px; background: rgb(251, 251, 155);}
        #d01{
            width: 200px; height: 200px; font-size: 15px;
            position: fixed; background: white;
        }
    </style>
</head>
<body>
    <div id="d01"></div>
    <div id="d02"></div>

    <script>
        // 스크롤 확인 객체
        // 이벤트 : onclick,dbclick,change,scroll
        window.addEventListener('scroll',function(){
            //스크롤 할 때 마다 함수를 실행 함.
            let scrollTop = document.documentElement.scrollTop;
            let scrollLeft = document.documentElement.scrollLeft;
            document.getElementById("d01").innerText =
        `y축으로 스크롤한 거리 : ${scrollTop} x축으로 스크롤한 거리 : ${scrollLeft}`;
        })

        // --------모니터 화면 사이즈 확인 객체 -innerHeight, innerWidth ------------
        // let height = window.innerHeight; // 모니터화면 세로사이즈
        // let width = window.innerWidth;   // 모니터화면 가로사이즈
        // let scrollTop = document.documentElement.scrollTop;
        // document.getElementById("d01").innerText =
        // `화면세로사이즈 : ${height}
        // 화면가로사이즈 : ${width}
        // y축으로 스크롤한 거리 : ${scrollTop}`;

    </script>
</body>
</html>
